<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Design Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #9cf5aa;
            font-family: 'Courier New', Courier, monospace;
            color: #111;
            padding: 60px 40px;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            /* ทำให้คอลัมน์ซ้ายและขวาสูงเท่ากันเสมอ */
            align-items: stretch;
        }

        .left-col {
            width: 52%;
            display: flex;
            flex-direction: column;
            /* ดันข้อความไปชิดบน และดันรูปภาพไปชิดล่าง */
            justify-content: space-between;
        }

        /* สร้างคลาสใหม่ครอบข้อความด้านบน */
        .text-section h1 {
            font-size: 46px;
            line-height: 1.2;
            margin-bottom: 25px;
        }

        .text-section p {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 35px;
            max-width: 400px;
        }

        .btn {
            background-color: #2b2b2b;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            width: fit-content;
        }

        .bottom-preview {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            /* เพิ่มระยะห่างกันปุ่มและรูปภาพในกรณีที่หน้าจอเล็ก */
        }

        .bottom-preview a {
            width: 48%;
            display: flex;
        }

        .bottom-preview img {
            width: 100%;
            height: auto;
            object-fit: cover;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .right-col {
            width: 44%;
            display: flex;
            gap: 20px;
        }

        .right-col a {
            width: 48%;
            display: flex;
        }

        .right-col img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* ทำให้รูปแนวตั้งเต็มกรอบพอดีกัน */
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .footer {
            text-align: center;
            margin-top: 70px;
            font-size: 14px;
            line-height: 1.5;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .left-col,
            .right-col {
                width: 100%;
            }

            .right-col {
                margin-top: 40px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ฝั่งซ้าย -->
        <div class="left-col">
            <!-- กล่องข้อความ (จะอยู่ด้านบนเสมอ) -->
            <div class="text-section">
                <h1>My Web Design by<br>HTML CSS</h1>

                <p>
                    Lorem ipsum dolor sit amet,<br>
                    consectetur adipiscing elit.<br>
                    Cursus imperdiet sed id elementum.<br>
                    Quam vel aliquam sit vulputate.
                </p>

                <button class="btn">Follow Me</button>
            </div>

            <!-- กล่องรูปล่างซ้าย (จะถูกดันลงมาล่างสุดเสมอ) -->
            <div class="bottom-preview">
                <a href="page_a.html"><img src="./images/sc1.jpeg" alt="Page A"></a>
                <a href="page_b.html"><img src="./images/sc2.jpeg" alt="Page B"></a>
            </div>
        </div>

        <!-- ฝั่งขวา -->
        <div class="right-col">
            <a href="page_c.html"><img src="./images/sc3.jpeg" alt="Page C"></a>
            <a href="page_d.html"><img src="./images/sc4.jpeg" alt="Page D"></a>
        </div>

    </div>

    <div class="footer">
        (รูปและเนื้อหาทั้งหมดใช้เพื่อการศึกษาเท่านั้น)<br>
        Created by NinniN SAU<br>
        Copyright © 2026 WoW WoW WoW
    </div>

</body>

</html>
